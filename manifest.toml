packaging_format = 2

id = "gittr"
name = "gittr"
description.en = "Self-hosted git forge on Nostr (NIP-34), with the gitnostr bridge for SSH git access"

version = "0.1~ynh13"

maintainers = ["imattau"]

[upstream]
license = "AGPL-3.0"
website = "https://gittr.space"
code = "https://github.com/arbadacarbaYK/gittr"

[integration]
yunohost = ">= 11.2"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = false
sso = false
disk = "1G"
ram.build = "2G"
ram.runtime = "512M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.admin]
    type = "user"

    [install.init_main_permission]
    # Generic reserved question — YunoHost's core handles the ask string and
    # the public/private choice, and seeds the `main` SSOwat permission's
    # allowed group from it (not saved as a regular app setting). Defaults
    # to public: gittr has its own Nostr-based login (NIP-07/pubkey), not a
    # YunoHost-account gate — matches `sso = false` / `ldap = false` above,
    # and a git forge that visitors can't browse or clone from without a
    # YunoHost account isn't very useful. See doc/DECISIONS.md item 14 for
    # why this (and resources.permissions below) was missing entirely
    # before — no tile, and the domain fell through to the SSO login page
    # instead of the app.
    type = "group"
    default = "visitors"

    [install.nostr_relays]
    type = "string"
    ask.en = "Which Nostr relays should the bridge and UI use?"
    default = "wss://relay.damus.io,wss://nos.lol"
    help.en = "Comma-separated relay list the bridge and UI will use."
    pattern.regexp = '^wss://[^,]+(,wss://[^,]+)*$'
    pattern.error = "Must be one or more comma-separated wss:// URLs, no spaces"

    [install.repo_owner_pubkey]
    type = "string"
    optional = true
    ask.en = "Hex pubkey allowed to own/create repos on this bridge (optional)"
    help.en = "Leave blank to watch all authors (upstream's default 'public GRASP' mode) — see doc/DECISIONS.md item 2."
    pattern.regexp = '^([0-9a-fA-F]{64})?$'
    pattern.error = "Must be a 64-character hex pubkey, or left blank"

    # nostr_relays and repo_owner_pubkey can both be changed after install
    # via the config panel (config_panel.toml + scripts/config) — see
    # doc/DECISIONS.md item 6.

[resources]
    [resources.permissions]
        # Required explicitly — it is NOT automatic even though a "main"
        # permission gets auto-created if this whole block is omitted (that
        # default has url = None, i.e. no SSOwat rule and no tile at all).
        # See doc/DECISIONS.md item 14.
        main.url = "/"

    [resources.system_user]
    # Left at its default (/var/www/__APP__) deliberately: it must stay equal
    # to install_dir's own default below, since the bridge writes
    # ~/.ssh/authorized_keys relative to $HOME=$install_dir (see
    # conf/systemd-bridge.service and doc/DECISIONS.md item 3). If either
    # path is ever customized, the other must be customized to match.

    [resources.install_dir]

    [resources.ports]
        # "main" is implicit (-> $port) and used only for the internal
        # nginx<->Next.js reverse proxy — left unexposed.
        #
        # git_ssh -> $port_git_ssh: the dedicated sshd instance that runs
        # git-nostr-ssh as a forced command, kept separate from the server's
        # admin SSH (22). git-nostr-ssh has no listener of its own — see
        # doc/DECISIONS.md item 3. `fixed` is left false so install doesn't
        # hard-fail if 2225 is already taken; check `yunohost app show gittr`
        # for the port actually picked.
        [resources.ports.git_ssh]
        default = 2225
        exposed = "TCP"

        # bridge_http -> $port_bridge_http: the bridge's internal
        # /api/event fast-lane (see doc/DECISIONS.md item 3). The binary
        # hardcodes a default of 8080 if BRIDGE_HTTP_PORT isn't set, which
        # collides with other apps/services on a shared box — confirmed in
        # practice, not hypothetical (see doc/DECISIONS.md item 13). Left
        # unexposed, same reasoning as before: it's not meant to be public.
        [resources.ports.bridge_http]
        default = 8080

    [resources.apt]
        # No build-essential: the bridge builds with CGO_ENABLED=0, no gcc needed.
        # openssh-server provides the sshd binary the dedicated git-ssh instance runs.
        # fcgiwrap provides the CGI-over-FastCGI wrapper for HTTPS git
        # (git-http-backend) — see doc/DECISIONS.md item 17.
        packages = "git, sqlite3, openssh-server, fcgiwrap"

    [resources.go]
        # helpers 2.1 provisions Go as a resource, not via a scripted
        # ynh_install_go call (that's the removed v1 API — see
        # doc/DECISIONS.md item 9). Sourcing the helpers auto-adds `go` to
        # $PATH in every script once this is provisioned; scripts/install
        # and scripts/upgrade just call `make` directly.
        # go.mod requires go >= 1.25.0.
        version = "1.25"

    [resources.nodejs]
        # Same deal as resources.go above — auto-adds `node`/`npm` to $PATH,
        # no ynh_install_nodejs call needed. $nodejs_dir is available for
        # conf/systemd-ui.service's ExecStart.
        version = "20"

    # No [resources.database]: a `type` (mysql/postgresql) is mandatory for
    # that resource, and it would provision a DB we'd never use — the bridge
    # stores everything in its own sqlite file under $install_dir/data/.

    [resources.sources]
        [resources.sources.main]
        # Pinned to the v0.2.6 tag (latest as of 2026-09-01) rather than `main`
        # — see doc/DECISIONS.md item 1. Re-verify and re-checksum on every bump.
        url = "https://github.com/arbadacarbaYK/gittr/archive/refs/tags/v0.2.6.tar.gz"
        sha256 = "d2027d291837e8c8b052875855c285caa3501cfc6b587c6994f06bd3b19a3aa0"
