location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# HTTPS git clone/push (git-http-backend via a dedicated fcgiwrap
# instance — see conf/systemd-fcgiwrap.socket/.service). Assumes a
# root-path install (default): the regex below anchors at __PATH__, and
# for a non-root install PATH_INFO would need the prefix stripped too,
# which this doesn't attempt. See doc/DECISIONS.md item 17.
#
# NO private-repo ACL gate: the upstream endpoint this would call
# (/api/git/http-auth, and its whole repo-read-access.ts dependency
# chain) does not exist in the pinned v0.2.6 tag — confirmed by checking
# the actual tag's source tree, not assumed from docs — it was added to
# upstream's main branch afterward, with no newer tag yet. Calling a
# nonexistent endpoint via auth_request turned this into a hard 500 for
# every request (nginx treats any non-2xx/401/403 auth_request response
# as an error, not "denied"), confirmed live. EVERY repo is readable and
# writable over HTTPS regardless of its Nostr-level public/private
# setting until this package's pinned tag is bumped past whatever tag
# eventually ships that endpoint — SSH is NOT affected, git-nostr-ssh has
# its own independent, working ACL enforcement untouched by any of this.
# See doc/DECISIONS.md item 18.
location ~ ^__PATH__/([^/]+)/(.+\.git)(.*)$ {
    client_max_body_size 500M;

    fastcgi_pass unix:__INSTALL_DIR__/fcgiwrap.sock;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME __INSTALL_DIR__/bin/git-http-backend-quiet;
    fastcgi_param GIT_HTTP_EXPORT_ALL "";
    fastcgi_param GIT_PROJECT_ROOT __INSTALL_DIR__/repositories;
    fastcgi_param PATH_INFO $uri;
    fastcgi_read_timeout 600s;
    fastcgi_send_timeout 600s;
    fastcgi_buffers 64 64k;
    fastcgi_buffer_size 64k;
    fastcgi_buffering off;
}
