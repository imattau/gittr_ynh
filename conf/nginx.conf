location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# No git-over-HTTPS route here. The bridge's HTTP port only serves an
# internal /api/event fast-lane (not git-http-backend), and real HTTPS smart
# git needs git-http-backend + fcgiwrap + an nginx auth_request stack that
# this v0.1 package deliberately doesn't build — see doc/DECISIONS.md item 3.
# Git access in this package is SSH-only, via the dedicated sshd instance on
# $port_git_ssh (see conf/sshd_config.j2 and conf/systemd-ssh.service).
