location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# HTTPS git clone/push (git-http-backend via a dedicated fcgiwrap
# instance — see conf/systemd-fcgiwrap.socket/.service). Assumes a
# root-path install (default): the regex below anchors at __PATH__, and
# for a non-root install PATH_INFO would need the prefix stripped too,
# which this doesn't attempt. See doc/DECISIONS.md item 17.

# Private-repo ACL check, mirrors SSH's owner/RepositoryPermission rules —
# already implemented in the UI itself (ui/src/pages/api/git/http-auth),
# nothing to build here.
location = /_git_auth {
    internal;
    proxy_pass http://127.0.0.1:__PORT__/api/git/http-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Nostr-Auth-Event $http_x_nostr_auth_event;
    proxy_set_header X-Nostr-Pubkey $http_x_nostr_pubkey;
    proxy_set_header X-Nostr-Signature $http_x_nostr_signature;
}

location @git_auth_denied {
    default_type text/plain;
    return 403 "Repository is private or you lack permission. Use SSH, or pass Nostr auth headers (X-Nostr-Auth-Event) via git -c http.extraHeader=...\n";
}

location ~ ^__PATH__/([^/]+)/(.+\.git)(.*)$ {
    client_max_body_size 500M;
    auth_request /_git_auth;
    error_page 401 403 = @git_auth_denied;

    fastcgi_pass unix:__INSTALL_DIR__/fcgiwrap.sock;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME __INSTALL_DIR__/bin/git-http-backend-quiet;
    fastcgi_param GIT_HTTP_EXPORT_ALL "";
    fastcgi_param GIT_PROJECT_ROOT __INSTALL_DIR__/repositories;
    fastcgi_param PATH_INFO $uri;
    fastcgi_read_timeout 600s;
    fastcgi_send_timeout 600s;
    fastcgi_buffers 64 64k;
    fastcgi_buffer_size 64k;
    fastcgi_buffering off;
}
